# NEXUS AI - full stack: PostgreSQL + Redis + FastAPI/LangGraph API + React web.
#
#   cp .env.example .env      # then set at least SECRET_KEY (and any LLM keys)
#   docker compose up --build
#
# Web UI  -> http://localhost:3000
# API docs-> http://localhost:8000/api/docs
#
# `env_file` supplies secrets and LLM settings from .env; the `environment`
# block below always wins, so container networking values cannot be broken by a
# local .env written for the SQLite setup.
name: nexus-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://nexus:nexus@db:5432/nexus
      REDIS_URL: redis://redis:6379/0
      CHECKPOINT_DATABASE_PATH: /app/data/nexus_checkpoints.db
      GENERATED_DOCUMENTS_DIR: /app/data/generated_documents
      # The SPA is same-origin behind nginx; these cover calling :8000 directly.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      SQLALCHEMY_ECHO: "false"
    volumes:
      # LangGraph checkpoints (SQLite) and generated documents survive restarts -
      # a paused workflow can still be resumed after `docker compose restart`.
      - app_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  app_data:
